<pre><span class="ln">1</span><span class="k">import</span> pandas <span class="k">as</span> pd
<span class="ln">2</span><span class="k">import</span> matplotlib.pyplot <span class="k">as</span> plt
<span class="ln">3</span>
<span class="ln">4</span>df = pd.<span class="f">read_csv</span>(<span class="s">"data/sleep.csv"</span>)
<span class="ln">5</span>
<span class="ln">6</span><span class="c"># mean evening mood for short (&lt; 6 h) vs normal nights</span>
<span class="ln">7</span><span class="k">def</span> <span class="f">mood_by_sleep</span>(df, cutoff=<span class="n">6</span>):<span class="cur"></span><span class="ghost">
<span class="ln">8</span>    short = df[df.hours &lt; cutoff].mood.mean()
<span class="ln">9</span>    normal = df[df.hours &gt;= cutoff].mood.mean()
<span class="ln">10</span>    return short, normal</span>
<span class="ln"> </span>
