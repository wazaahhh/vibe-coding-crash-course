<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 240" font-family="Inter, -apple-system, Segoe UI, sans-serif">
  <title>AlphaFold: from an amino-acid sequence to a predicted 3-D protein structure, coloured by confidence</title>
  <rect width="360" height="240" rx="14" fill="#F7F9FC"/>
  <text x="18" y="30" font-size="13" fill="#4D5B73">amino-acid sequence</text>
  <text x="18" y="54" font-size="15" fill="#11233F" font-family="Menlo, monospace">MKTAYIAKQRQISFVKSH…</text>
  <line x1="180" y1="66" x2="180" y2="90" stroke="#11233F" stroke-width="2"/>
  <path d="M174 84 L180 94 L186 84 z" fill="#11233F"/>
  <!-- ribbon-like fold -->
  <g fill="none" stroke-linecap="round" stroke-width="9">
    <path d="M70 200 C 60 150, 120 140, 110 110 S 160 100, 170 130" stroke="#0053D6"/>
    <path d="M170 130 C 180 170, 230 175, 220 140 S 260 105, 280 120" stroke="#65CBF3"/>
    <path d="M280 120 C 300 140, 300 190, 260 200 S 200 215, 180 195" stroke="#0053D6"/>
    <path d="M180 195 C 160 175, 120 210, 100 190" stroke="#FFDB13"/>
    <path d="M100 190 C 90 180, 80 205, 70 200" stroke="#FF7D45"/>
  </g>
  <g font-size="11" fill="#4D5B73">
    <rect x="18" y="214" width="10" height="10" fill="#0053D6"/><text x="32" y="223">very high</text>
    <rect x="92" y="214" width="10" height="10" fill="#65CBF3"/><text x="106" y="223">confident</text>
    <rect x="166" y="214" width="10" height="10" fill="#FFDB13"/><text x="180" y="223">low</text>
    <rect x="212" y="214" width="10" height="10" fill="#FF7D45"/><text x="226" y="223">very low</text>
  </g>
</svg>
