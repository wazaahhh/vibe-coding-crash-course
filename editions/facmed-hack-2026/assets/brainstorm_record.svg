<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 400" font-family="Inter, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <title>Record the brainstorm on a phone, transcribe it with AI, get next steps, all pointed at the team's goal</title>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4D5B73"/>
    </marker>
  </defs>

  <!-- Goal banner: the whole flow serves it -->
  <g transform="translate(440,46)">
    <circle r="30" fill="#EBCFDC"/><circle r="20" fill="#fff"/><circle r="11" fill="#96004B"/>
    <line x1="34" y1="-30" x2="4" y2="-3" stroke="#11233F" stroke-width="4" stroke-linecap="round"/>
    <path d="M30,-38 l12,2 -2,12" fill="none" stroke="#11233F" stroke-width="4" stroke-linejoin="round"/>
  </g>
  <text x="440" y="104" text-anchor="middle" font-size="20" font-weight="800" fill="#96004B">Your challenge's final goal</text>
  <path d="M150,150 C150,122 300,118 440,118 C580,118 730,122 730,150" fill="none" stroke="#96004B" stroke-width="2.5" stroke-dasharray="6 6"/>

  <!-- 1 · Record -->
  <g transform="translate(150,0)">
    <rect x="-46" y="160" width="92" height="160" rx="16" fill="#11233F"/>
    <rect x="-38" y="176" width="76" height="122" rx="6" fill="#E3E7FF"/>
    <circle cx="0" cy="309" r="5" fill="#A9B8CE"/>
    <rect x="-11" y="200" width="22" height="40" rx="11" fill="#96004B"/>
    <path d="M-20,228 a20,20 0 0 0 40,0" fill="none" stroke="#96004B" stroke-width="4"/>
    <line x1="0" y1="248" x2="0" y2="262" stroke="#96004B" stroke-width="4"/>
    <line x1="-12" y1="262" x2="12" y2="262" stroke="#96004B" stroke-width="4" stroke-linecap="round"/>
    <circle cx="26" cy="186" r="5" fill="#E5484D"/>
    <text x="0" y="356" text-anchor="middle" font-size="22" font-weight="800" fill="#11233F">1 · Record</text>
    <text x="0" y="382" text-anchor="middle" font-size="16" fill="#4D5B73">on your phone, with everyone's OK</text>
  </g>

  <line x1="222" y1="240" x2="338" y2="240" stroke="#4D5B73" stroke-width="3" marker-end="url(#arr)"/>

  <!-- 2 · Transcribe -->
  <g transform="translate(440,0)">
    <rect x="-80" y="168" width="160" height="148" rx="12" fill="#fff" stroke="#D7E1EC" stroke-width="2"/>
    <rect x="-80" y="168" width="160" height="30" rx="12" fill="#D9F0F4"/>
    <text x="0" y="189" text-anchor="middle" font-size="14" font-weight="800" fill="#11233F">transcript</text>
    <g fill="#A9B8CE">
      <rect x="-64" y="212" width="18" height="8" rx="4" fill="#4FA5B8"/><rect x="-40" y="212" width="100" height="8" rx="4"/>
      <rect x="-64" y="230" width="18" height="8" rx="4" fill="#6E7CF6"/><rect x="-40" y="230" width="80" height="8" rx="4"/>
      <rect x="-64" y="248" width="18" height="8" rx="4" fill="#96004B"/><rect x="-40" y="248" width="104" height="8" rx="4"/>
      <rect x="-64" y="266" width="18" height="8" rx="4" fill="#4FA5B8"/><rect x="-40" y="266" width="64" height="8" rx="4"/>
      <rect x="-64" y="284" width="18" height="8" rx="4" fill="#6E7CF6"/><rect x="-40" y="284" width="92" height="8" rx="4"/>
    </g>
    <text x="0" y="356" text-anchor="middle" font-size="22" font-weight="800" fill="#11233F">2 · Transcribe</text>
    <text x="0" y="382" text-anchor="middle" font-size="16" fill="#4D5B73">with AI: who said what</text>
  </g>

  <line x1="542" y1="240" x2="648" y2="240" stroke="#4D5B73" stroke-width="3" marker-end="url(#arr)"/>

  <!-- 3 · Synthesise -->
  <g transform="translate(730,0)">
    <rect x="-80" y="168" width="160" height="148" rx="12" fill="#fff" stroke="#96004B" stroke-width="2.5"/>
    <text x="0" y="194" text-anchor="middle" font-size="14" font-weight="800" fill="#96004B">next steps</text>
    <g font-size="14" fill="#11233F">
      <rect x="-64" y="210" width="16" height="16" rx="4" fill="#96004B"/><path d="M-60,218 l4,4 8,-9" fill="none" stroke="#fff" stroke-width="2.5"/>
      <text x="-40" y="223">decision</text>
      <rect x="-64" y="240" width="16" height="16" rx="4" fill="none" stroke="#96004B" stroke-width="2"/>
      <text x="-40" y="253">task · who · when</text>
      <rect x="-64" y="270" width="16" height="16" rx="4" fill="none" stroke="#96004B" stroke-width="2"/>
      <text x="-40" y="283">task · who · when</text>
      <text x="-64" y="306" fill="#4D5B73">? open question</text>
    </g>
    <text x="0" y="356" text-anchor="middle" font-size="22" font-weight="800" fill="#11233F">3 · Synthesise</text>
    <text x="0" y="382" text-anchor="middle" font-size="16" fill="#4D5B73">decisions and next steps</text>
  </g>
</svg>
