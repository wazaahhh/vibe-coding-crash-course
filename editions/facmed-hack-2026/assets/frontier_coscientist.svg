<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 240" font-family="Inter, -apple-system, Segoe UI, sans-serif">
  <title>AI co-scientist: a scientist states a goal; several AI agents generate hypotheses, review them, debate them in a tournament, rank and refine them, and return the best to the scientist</title>
  <defs><marker id="m" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#11233F"/></marker></defs>
  <rect width="360" height="240" rx="14" fill="#F7F9FC"/>
  <rect x="120" y="14" width="120" height="34" rx="8" fill="#ffffff" stroke="#11233F"/>
  <text x="180" y="36" text-anchor="middle" font-size="13" fill="#11233F">scientist's goal</text>
  <line x1="180" y1="48" x2="180" y2="70" stroke="#11233F" stroke-width="1.8" marker-end="url(#m)"/>
  <g font-size="12" fill="#11233F" text-anchor="middle">
    <rect x="18" y="76" width="96" height="30" rx="7" fill="#EBCFDC" stroke="#96004B"/><text x="66" y="95">generate</text>
    <rect x="132" y="76" width="96" height="30" rx="7" fill="#EBCFDC" stroke="#96004B"/><text x="180" y="95">review</text>
    <rect x="246" y="76" width="96" height="30" rx="7" fill="#EBCFDC" stroke="#96004B"/><text x="294" y="95">debate</text>
    <rect x="18" y="128" width="96" height="30" rx="7" fill="#EBCFDC" stroke="#96004B"/><text x="66" y="147">evolve</text>
    <rect x="132" y="128" width="96" height="30" rx="7" fill="#EBCFDC" stroke="#96004B"/><text x="180" y="147">rank (tournament)</text>
    <rect x="246" y="128" width="96" height="30" rx="7" fill="#EBCFDC" stroke="#96004B"/><text x="294" y="147">meta-review</text>
  </g>
  <path d="M114 91 L128 91 M228 91 L242 91 M294 106 L294 124 M246 143 L232 143 M132 143 L118 143 M66 128 L66 110" stroke="#11233F" stroke-width="1.6" marker-end="url(#m)"/>
  <line x1="180" y1="158" x2="180" y2="180" stroke="#11233F" stroke-width="1.8" marker-end="url(#m)"/>
  <rect x="90" y="186" width="180" height="34" rx="8" fill="#D9F0F4" stroke="#4FA5B8"/>
  <text x="180" y="208" text-anchor="middle" font-size="13" fill="#11233F">ranked hypotheses → the lab</text>
</svg>
