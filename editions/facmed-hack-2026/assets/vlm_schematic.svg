<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 300" font-family="Inter, -apple-system, Segoe UI, sans-serif">
  <title>How a vision-language model reads an image: the image (here an EEG trace) is cut into patches, a vision encoder turns each patch into a vector, a projection makes these image tokens look like word tokens, they join the text tokens in the same transformer, and the model writes text one token at a time</title>
  <defs>
    <marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#11233F"/></marker>
  </defs>
  <rect width="1160" height="300" fill="#ffffff"/>

  <!-- 1 image -->
  <text x="20" y="30" font-size="15" font-weight="700" fill="#7C8AA1">1 · AN IMAGE</text>
  <rect x="20" y="46" width="170" height="130" rx="8" fill="#F7F9FC" stroke="#D7E1EC"/>
  <polyline points="40,65.2 42,70.3 44,66.7 46,67.8 48,61.4 50,63.1 52,65.8 54,69.3 56,69.2 58,61.6 60,65.5 62,63.7 64,68.7 66,70.8 68,65.6 70,64.4 72,61.7 74,67.0 76,69.6 78,68.3 80,68.5 82,59.7 84,65.2 86,66.6 88,67.9 90,68.7 92,64.0 94,64.2 96,63.6 98,68.8 100,71.2 102,67.0 104,65.6 106,61.8 108,65.6 110,70.0 112,69.2 114,67.1 116,60.1 118,63.6 120,66.8 122,68.5 124,70.5 126,62.9 128,64.6 130,61.9 132,67.1 134,70.4 136,66.7 138,67.5 140,61.2 142,67.0 144,69.0 146,70.1 148,69.2 150,60.5 152,65.6 154,65.9 156,70.1 158,70.3 160,64.8 162,64.0 164,62.6 166,67.7 168,68.9 170,65.9 172,67.7 174,62.0 176,64.3 178,67.9 180,68.8" fill="none" stroke="#4D5B73" stroke-width="1.3"/>
  <text x="26" y="70" font-size="10" fill="#7C8AA1">C1</text>
  <polyline points="40,95.7 42,92.4 44,94.2 46,89.2 48,87.6 50,94.4 52,92.1 54,96.9 56,88.8 58,90.2 60,92.1 62,92.3 64,98.9 66,90.9 68,89.8 70,88.6 72,89.0 74,95.3 76,93.0 78,94.5 80,86.9 82,87.7 84,94.3 86,92.9 88,98.1 90,90.7 92,89.2 94,89.7 96,92.2 98,97.7 100,92.2 102,92.0 104,88.1 106,91.6 108,95.6 110,93.3 112,95.4 114,87.1 116,88.7 118,93.7 120,93.6 122,97.1 124,88.4 126,89.8 128,89.3 130,90.6 132,97.3 134,92.7 136,91.2 138,87.8 140,90.2 142,95.3 144,93.3 146,96.0 148,88.7 150,88.1 152,90.0 154,94.1 156,98.4 158,89.5 160,90.5 162,88.6 164,91.4 166,96.1 168,92.2 170,92.7 172,87.4 174,89.7 176,93.5 178,94.9 180,94.3" fill="none" stroke="#4D5B73" stroke-width="1.3"/>
  <text x="26" y="96" font-size="10" fill="#7C8AA1">C2</text>
  <polyline points="40,119.9 42,119.5 44,114.8 46,112.9 48,121.3 50,118.6 52,121.0 54,116.4 56,114.5 58,116.2 60,117.0 62,122.9 64,119.5 66,116.1 68,116.4 70,114.1 72,121.9 74,120.1 76,120.8 78,115.1 80,113.0 82,118.5 84,119.2 86,121.6 88,117.7 90,115.5 92,115.7 94,116.5 96,124.3 98,119.0 100,118.0 102,114.5 104,113.8 106,121.3 108,120.4 110,119.8 112,114.7 114,113.7 116,118.9 118,107.5 120,132.9 122,124.6 124,120.7 126,121.2 128,117.9 130,124.8 132,118.6 134,119.4 136,115.8 138,114.0 140,122.0 142,120.5 144,121.8 146,115.2 148,113.7 150,117.6 152,117.8 154,122.0 156,117.4 158,115.2 160,116.2 162,115.2 164,124.2 166,119.5 168,120.1 170,115.5 172,116.0 174,120.8 176,118.0 178,122.7 180,114.3" fill="none" stroke="#96004B" stroke-width="1.8"/>
  <text x="26" y="122" font-size="10" fill="#7C8AA1">C3</text>
  <polyline points="40,143.3 42,143.1 44,139.0 46,145.7 48,147.2 50,147.4 52,143.7 54,138.3 56,144.6 58,143.3 60,149.4 62,145.5 64,140.5 66,142.3 68,141.4 70,146.8 72,147.4 74,146.1 76,143.5 78,139.8 80,144.0 82,145.7 84,148.9 86,142.9 88,138.8 90,142.4 92,142.8 94,148.6 96,145.8 98,143.1 100,140.5 102,138.7 104,146.4 106,145.1 108,144.5 110,144.0 112,140.0 114,143.8 116,144.8 118,147.8 120,143.8 122,139.7 124,143.1 126,142.4 128,148.5 130,144.9 132,142.7 134,140.6 136,140.0 138,147.8 140,145.5 142,145.4 144,141.7 146,138.8 148,144.7 150,145.1 152,148.5 154,145.3 156,141.2 158,142.0 160,141.3 162,148.8 164,146.4 166,143.9 168,142.2 170,139.5 172,145.9 174,145.7 176,148.1 178,141.4 180,139.3" fill="none" stroke="#4D5B73" stroke-width="1.3"/>
  <text x="26" y="148" font-size="10" fill="#7C8AA1">C4</text>
  <text x="105" y="196" text-anchor="middle" font-size="13" fill="#4D5B73">an EEG trace, a brain scan, a slice</text>
  <line x1="196" y1="110" x2="228" y2="110" stroke="#11233F" stroke-width="2" marker-end="url(#ar)"/>

  <!-- 2 patches -->
  <text x="234" y="30" font-size="15" font-weight="700" fill="#7C8AA1">2 · PATCHES</text>
  <g stroke="#4FA5B8" fill="#D9F0F4">
    <rect x="234" y="46" width="40" height="40" rx="4"/><rect x="278" y="46" width="40" height="40" rx="4"/><rect x="322" y="46" width="40" height="40" rx="4"/>
    <rect x="234" y="90" width="40" height="40" rx="4"/><rect x="278" y="90" width="40" height="40" rx="4"/><rect x="322" y="90" width="40" height="40" rx="4"/>
    <rect x="234" y="134" width="40" height="40" rx="4"/><rect x="278" y="134" width="40" height="40" rx="4"/><rect x="322" y="134" width="40" height="40" rx="4"/>
  </g>
  <text x="298" y="196" text-anchor="middle" font-size="13" fill="#4D5B73">small squares, like words</text>
  <line x1="370" y1="110" x2="402" y2="110" stroke="#11233F" stroke-width="2" marker-end="url(#ar)"/>

  <!-- 3 vision encoder -->
  <text x="408" y="30" font-size="15" font-weight="700" fill="#7C8AA1">3 · VISION ENCODER</text>
  <rect x="408" y="62" width="170" height="96" rx="10" fill="#E3E7FF" stroke="#6E7CF6"/>
  <text x="493" y="104" text-anchor="middle" font-size="15" fill="#11233F">a transformer</text>
  <text x="493" y="126" text-anchor="middle" font-size="15" fill="#11233F">for images</text>
  <text x="493" y="196" text-anchor="middle" font-size="13" fill="#4D5B73">one vector per patch</text>
  <line x1="584" y1="110" x2="616" y2="110" stroke="#11233F" stroke-width="2" marker-end="url(#ar)"/>

  <!-- 4 joined tokens -->
  <text x="622" y="30" font-size="15" font-weight="700" fill="#7C8AA1">4 · IMAGE + TEXT TOKENS</text>
  <g font-size="14" fill="#11233F" text-anchor="middle">
    <rect x="622" y="58" width="30" height="30" rx="6" fill="#E3E7FF" stroke="#6E7CF6"/>
    <rect x="656" y="58" width="30" height="30" rx="6" fill="#E3E7FF" stroke="#6E7CF6"/>
    <rect x="690" y="58" width="30" height="30" rx="6" fill="#E3E7FF" stroke="#6E7CF6"/>
    <text x="736" y="78">…</text>
    <rect x="622" y="96" width="50" height="30" rx="6" fill="#D9F0F4" stroke="#4FA5B8"/><text x="647" y="116">Any</text>
    <rect x="676" y="96" width="74" height="30" rx="6" fill="#D9F0F4" stroke="#4FA5B8"/><text x="713" y="116">spikes</text>
    <rect x="754" y="96" width="30" height="30" rx="6" fill="#D9F0F4" stroke="#4FA5B8"/><text x="769" y="116">?</text>
  </g>
  <text x="622" y="150" font-size="13" fill="#4D5B73">image tokens join the words</text>
  <text x="622" y="167" font-size="13" fill="#4D5B73">of your question</text>
  <line x1="792" y1="110" x2="824" y2="110" stroke="#11233F" stroke-width="2" marker-end="url(#ar)"/>

  <!-- 5 LLM -->
  <text x="830" y="30" font-size="15" font-weight="700" fill="#7C8AA1">5 · THE SAME LLM</text>
  <rect x="846" y="122" width="150" height="30" rx="7" fill="#EBCFDC" stroke="#96004B"/>
  <rect x="838" y="88" width="150" height="30" rx="7" fill="#EBCFDC" stroke="#96004B"/>
  <rect x="830" y="54" width="150" height="30" rx="7" fill="#EBCFDC" stroke="#96004B"/>
  <text x="905" y="74" text-anchor="middle" font-size="14" fill="#96004B">attention</text>
  <line x1="1000" y1="110" x2="1028" y2="110" stroke="#11233F" stroke-width="2" marker-end="url(#ar)"/>

  <!-- 6 text out -->
  <text x="1034" y="30" font-size="15" font-weight="700" fill="#7C8AA1">6 · TEXT</text>
  <rect x="1034" y="62" width="112" height="96" rx="10" fill="#F7F9FC" stroke="#D7E1EC"/>
  <text x="1046" y="92" font-size="14" fill="#11233F">"One spike-</text>
  <text x="1046" y="112" font-size="14" fill="#11233F">wave on C3,</text>
  <text x="1046" y="132" font-size="14" fill="#11233F">mid-trace…"</text>

  <text x="580" y="250" text-anchor="middle" font-size="15" fill="#96004B">Every word can attend to every patch: the model "looks" where your question points it.</text>
  <text x="580" y="284" text-anchor="middle" font-size="13" fill="#7C8AA1">Schematic. Trained on huge sets of image–caption pairs, then tuned to answer questions about images.</text>
</svg>
