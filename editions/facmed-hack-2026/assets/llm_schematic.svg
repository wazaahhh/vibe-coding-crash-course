<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 330" font-family="Inter, -apple-system, Segoe UI, sans-serif">
  <title>How an LLM produces text: the prompt is split into tokens, numbers flow through a stack of transformer layers, the model outputs a probability for every possible next token, one is picked and appended, and the loop repeats</title>
  <defs>
    <marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#11233F"/></marker>
    <marker id="ar2" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#96004B"/></marker>
  </defs>
  <rect width="1160" height="330" fill="#ffffff"/>

  <!-- 1 prompt -->
  <text x="20" y="30" font-size="15" font-weight="700" fill="#7C8AA1">1 · YOUR TEXT</text>
  <rect x="20" y="48" width="200" height="74" rx="10" fill="#F7F9FC" stroke="#D7E1EC"/>
  <text x="34" y="80" font-size="17" fill="#11233F">"The neuron fired</text>
  <text x="34" y="104" font-size="17" fill="#11233F">because"</text>
  <line x1="220" y1="85" x2="252" y2="85" stroke="#11233F" stroke-width="2" marker-end="url(#ar)"/>

  <!-- 2 tokens -->
  <text x="258" y="30" font-size="15" font-weight="700" fill="#7C8AA1">2 · TOKENS → NUMBERS</text>
  <g font-size="15" fill="#11233F" text-anchor="middle">
    <rect x="258" y="52" width="58" height="30" rx="6" fill="#D9F0F4" stroke="#4FA5B8"/><text x="287" y="72">The</text>
    <rect x="320" y="52" width="58" height="30" rx="6" fill="#D9F0F4" stroke="#4FA5B8"/><text x="349" y="72">neur</text>
    <rect x="382" y="52" width="40" height="30" rx="6" fill="#D9F0F4" stroke="#4FA5B8"/><text x="402" y="72">on</text>
    <rect x="258" y="90" width="58" height="30" rx="6" fill="#D9F0F4" stroke="#4FA5B8"/><text x="287" y="110">fired</text>
    <rect x="320" y="90" width="102" height="30" rx="6" fill="#D9F0F4" stroke="#4FA5B8"/><text x="371" y="110">because</text>
  </g>
  <text x="258" y="145" font-size="13" fill="#4D5B73">each token becomes a vector</text>
  <text x="258" y="162" font-size="13" fill="#4D5B73">of thousands of numbers</text>
  <line x1="430" y1="85" x2="462" y2="85" stroke="#11233F" stroke-width="2" marker-end="url(#ar)"/>

  <!-- 3 transformer stack -->
  <text x="468" y="30" font-size="15" font-weight="700" fill="#7C8AA1">3 · TRANSFORMER LAYERS</text>
  <g>
    <rect x="484" y="122" width="200" height="30" rx="7" fill="#EBCFDC" stroke="#96004B"/>
    <rect x="476" y="88" width="200" height="30" rx="7" fill="#EBCFDC" stroke="#96004B"/>
    <rect x="468" y="54" width="200" height="30" rx="7" fill="#EBCFDC" stroke="#96004B"/>
    <text x="568" y="74" text-anchor="middle" font-size="14" fill="#96004B">attention + feed-forward</text>
    <text x="568" y="182" text-anchor="middle" font-size="13" fill="#4D5B73">billions of learned weights,</text>
    <text x="568" y="199" text-anchor="middle" font-size="13" fill="#4D5B73">dozens of layers</text>
  </g>
  <line x1="690" y1="85" x2="722" y2="85" stroke="#11233F" stroke-width="2" marker-end="url(#ar)"/>

  <!-- 4 probabilities -->
  <text x="728" y="30" font-size="15" font-weight="700" fill="#7C8AA1">4 · NEXT-TOKEN PROBABILITIES</text>
  <g font-size="15" fill="#11233F">
    <text x="728" y="66">it</text><rect x="800" y="52" width="186" height="18" rx="4" fill="#96004B"/><text x="994" y="66">0.41</text>
    <text x="728" y="94">the</text><rect x="800" y="80" width="80" height="18" rx="4" fill="#4FA5B8"/><text x="888" y="94">0.18</text>
    <text x="728" y="122">of</text><rect x="800" y="108" width="50" height="18" rx="4" fill="#4FA5B8"/><text x="858" y="122">0.11</text>
    <text x="728" y="150">a</text><rect x="800" y="136" width="32" height="18" rx="4" fill="#4FA5B8"/><text x="840" y="150">0.07</text>
    <text x="728" y="178">…</text><text x="800" y="178" fill="#4D5B73">50 000+ other tokens</text>
  </g>
  <text x="1040" y="66" font-size="14" fill="#96004B" font-weight="700">pick one</text>

  <!-- 5 loop back -->
  <path d="M1080 76 C 1140 76, 1140 290, 1000 290 L 140 290 C 110 290, 110 150, 118 128" fill="none" stroke="#96004B" stroke-width="2.5" marker-end="url(#ar2)"/>
  <text x="560" y="280" text-anchor="middle" font-size="15" fill="#96004B">5 · append "it" to the text, and run again, one token at a time: "…because it received enough input."</text>
  <text x="560" y="318" text-anchor="middle" font-size="13" fill="#7C8AA1">Illustrative numbers. Training set the weights by predicting the next token on huge text corpora; tuning taught it to follow instructions.</text>
</svg>
